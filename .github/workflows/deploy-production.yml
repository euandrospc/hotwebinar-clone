name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Configure chat AI when a bootstrap secret is provided
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          BOOTSTRAP_OPENAI_API_KEY: ${{ secrets.BOOTSTRAP_OPENAI_API_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          key = os.environ.get("BOOTSTRAP_OPENAI_API_KEY", "").strip()
          if not key:
              print("No chat AI configuration change requested.")
              raise SystemExit(0)
          token = os.environ.get("COOLIFY_DEPLOY_TOKEN", "")
          if not token:
              raise SystemExit("Missing Coolify deployment credential.")
          payload = {"data": [{
              "key": "OPENAI_API_KEY", "value": key,
              "is_preview": False, "is_literal": True, "is_multiline": False,
              "is_runtime": True, "is_buildtime": False
          }]}
          request = urllib.request.Request(
              "http://82.25.64.13:8000/api/v1/applications/c4o88swcok8soow8o4g0o8gc/envs/bulk",
              data=json.dumps(payload).encode(), method="PATCH",
              headers={"Authorization": f"Bearer {token}", "Content-Type": "application/json"}
          )
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  saved = json.load(response)
          except urllib.error.HTTPError as error:
              # Response bodies may contain credentials. Never print them.
              raise SystemExit(f"Coolify rejected chat AI configuration (HTTP {error.code}).")
          except Exception:
              raise SystemExit("Could not confirm chat AI configuration in Coolify.")
          configured = next((item for item in saved if isinstance(item, dict) and item.get("key") == "OPENAI_API_KEY"), None) if isinstance(saved, list) else None
          if not configured or not configured.get("is_runtime") or configured.get("is_preview") or configured.get("is_buildtime"):
              raise SystemExit("Coolify did not confirm the production runtime configuration.")
          print("OPENAI_API_KEY configured for production runtime.")
          PY

      - name: Trigger Coolify deployment
        id: deploy
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_DEPLOY_TOKEN"
          curl --fail-with-body --silent --show-error --max-time 60 \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            'http://82.25.64.13:8000/api/v1/deploy?uuid=c4o88swcok8soow8o4g0o8gc&force=false' \
            --output response.json
          jq -e '.deployments | length > 0' response.json > /dev/null
          jq '.deployments[] | {message, deployment_uuid}' response.json
          deployment_uuid=$(jq -er '.deployments[0].deployment_uuid' response.json)
          echo "deployment_uuid=$deployment_uuid" >> "$GITHUB_OUTPUT"

      - name: Verify deployment and production health
        env:
          COOLIFY_DEPLOY_TOKEN: ${{ secrets.COOLIFY_DEPLOY_TOKEN }}
          DEPLOYMENT_UUID: ${{ steps.deploy.outputs.deployment_uuid }}
        run: |
          set -euo pipefail
          api=http://82.25.64.13:8000/api/v1
          for attempt in $(seq 1 100); do
            curl --fail --silent --show-error --retry 3 --retry-delay 3 --max-time 30 \
              --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
              "$api/deployments/$DEPLOYMENT_UUID" --output deployment.json
            jq '{status,commit,application_name}' deployment.json
            status=$(jq -r '.status' deployment.json)
            if [[ "$status" == "finished" ]]; then
              jq -e --arg sha "$GITHUB_SHA" '.commit == $sha' deployment.json >/dev/null
              break
            fi
            if [[ "$status" == *failed* || "$status" == *cancel* ]]; then exit 1; fi
            if [[ "$attempt" == 100 ]]; then exit 1; fi
            sleep 10
          done
          curl --fail --silent --show-error --max-time 30 \
            --header "Authorization: Bearer $COOLIFY_DEPLOY_TOKEN" \
            "$api/applications/c4o88swcok8soow8o4g0o8gc" --output app.json
          jq '{fqdn,status}' app.json
          fqdn=$(jq -er '.fqdn | split(",")[0]' app.json)
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --max-time 30 \
            "${fqdn%/}/api/health" --output health.json
          jq '{status,db}' health.json
          jq -e '.status == "ok" and .db == "ok"' health.json >/dev/null
